<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friday</title>
<style>
:root{--bg:#050b14;--panel:#0b1626;--line:#16324d;--cy:#38e8ff;--cy2:#1b9fc2;--tx:#d8f3fb;--mut:#7fa3b3;--ok:#46f0a0;--bad:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Rajdhani","Segoe UI",system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--cy);outline:none}
input,select{background:#07101c;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus{border-color:var(--cy);outline:none}
#lock,#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:9;padding:20px;text-align:center}
#boot{display:none}#boot h1{font-size:34px;letter-spacing:.3em;color:var(--cy);margin:0;animation:fl 1s steps(2) 3}
@keyframes fl{50%{opacity:.25}}
#app{display:none;max-width:560px;margin:0 auto;padding:18px 14px 40px}
.orbwrap{display:flex;flex-direction:column;align-items:center;margin:6px 0 14px}
.orb{position:relative;width:170px;height:170px}
.orb i{position:absolute;border-radius:50%;border:2px solid transparent}
.r1{inset:0;border-top-color:var(--cy)!important;border-bottom-color:var(--cy)!important;animation:sp 6s linear infinite}
.r2{inset:16px;border-left-color:var(--cy2)!important;border-right-color:var(--cy2)!important;animation:sp 4s linear infinite reverse}
.r3{inset:34px;border:2px dashed var(--cy)!important;opacity:.6;animation:sp 12s linear infinite}
.core{position:absolute;inset:58px;border-radius:50%;background:radial-gradient(circle,#c9faff,var(--cy) 45%,#0a4a63);box-shadow:0 0 30px var(--cy),0 0 70px #38e8ff55;animation:pu 2.4s ease-in-out infinite}
.orb.talk .core{animation-duration:.5s}.orb.listen .r1{border-top-color:var(--ok)!important;border-bottom-color:var(--ok)!important}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{50%{transform:scale(.88);opacity:.8}}
.name{margin-top:12px;font-size:22px;letter-spacing:.45em;color:var(--cy);padding-left:.45em}
#status{color:var(--mut);font-size:13px;min-height:20px}
.row{display:flex;gap:8px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{font-size:13px;padding:5px 10px}
#log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;height:190px;overflow:auto;font-size:14px}
#log p{margin:0 0 7px}.u{color:var(--mut)}.f{color:var(--tx)}.f b{color:var(--cy)}
.tabs{display:flex;gap:6px;margin:16px 0 8px;overflow-x:auto}.tabs button.on{border-color:var(--cy);color:var(--cy)}
.pane{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.pane.on{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.out{margin-top:10px;font-size:14px}.out .k{color:var(--cy)}
svg{width:100%;height:auto;margin-top:8px}
.item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.item span{flex:1}
.bar{height:6px;background:#07101c;border-radius:3px;overflow:hidden;margin-top:4px}.bar b{display:block;height:100%;background:var(--cy)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<div id="lock"><div class="orb" style="width:90px;height:90px"><i class="r1"></i><i class="r2" style="inset:10px"></i><div class="core" style="inset:32px"></div></div>
<div class="name">FRIDAY</div>
<input id="pw" type="password" placeholder="Password daalo" style="max-width:240px;text-align:center">
<button id="unl">Unlock</button><div id="lmsg" style="color:var(--mut);font-size:13px"></div></div>
<div id="boot"><h1>SYSTEM ON</h1><div id="bt" style="color:var(--mut)"></div></div>

<div id="app">
<div class="orbwrap"><div class="orb" id="orb"><i class="r1"></i><i class="r2"></i><i class="r3"></i><div class="core"></div></div>
<div class="name">FRIDAY</div><div id="status">Ready</div></div>
<div id="log"></div>
<div class="row"><input id="cmd" placeholder='Kuch bhi poocho ya command do' autocomplete="off"><button id="go">Go</button><button id="mic" title="Bolo">🎤</button></div>
<div class="chips" id="chips"></div>
<div class="tabs" id="tabs"></div>

<div class="pane" id="p-eco">
<div style="color:var(--mut);font-size:13px;margin-bottom:8px">Naya business shuru karne se pehle apne numbers daalo. Friday 24 mahine ka plan aur risk check karegi.</div>
<div class="g2">
<div><label>Startup investment (₹)</label><input id="e1" type="number" value="100000"></div>
<div><label>Monthly fixed cost: rent, bijli, staff (₹)</label><input id="e2" type="number" value="15000"></div>
<div><label>Selling price / unit (₹)</label><input id="e3" type="number" value="120"></div>
<div><label>Cost / unit: maal, packing (₹)</label><input id="e4" type="number" value="70"></div>
<div><label>Pehle mahine ki sales (units)</label><input id="e5" type="number" value="200"></div>
<div><label>Monthly growth (%)</label><input id="e6" type="number" value="8"></div>
<div><label>Max capacity / mahina (units)</label><input id="e7" type="number" value="1500"></div>
<div><label>Aapko monthly chahiye (₹)</label><input id="e8" type="number" value="10000"></div>
<div><label>Loan (₹, 0 = nahi)</label><input id="e9" type="number" value="0"></div>
<div><label>Loan interest (% saal)</label><input id="e10" type="number" value="12"></div>
<div><label>Loan tenure (mahine)</label><input id="e11" type="number" value="24"></div></div>
<button id="ecoGo" style="margin-top:10px;width:100%">Business check karo</button><div class="out" id="eout"></div><div id="echart"></div></div>
<div class="pane" id="p-notes"><div class="row"><input id="ni" placeholder="Note likho"><button id="na">Add</button></div><div id="nl"></div></div>

<div class="pane" id="p-books"><div class="g2"><div><label>Book ka naam</label><input id="bn"></div><div><label>Total pages</label><input id="bp" type="number"></div></div>
<button id="ba" style="margin:8px 0;width:100%">Book add karo</button><div id="bl"></div></div>

<div class="pane" id="p-grow"><div id="tip" style="margin-bottom:10px"></div><button id="tipn">Naya tip</button>
<h4 style="margin:14px 0 4px;color:var(--cy)">Aaj ki habits</h4><div class="row"><input id="hi" placeholder="Nayi habit"><button id="ha">Add</button></div><div id="hl"></div></div>

<div class="pane" id="p-set"><label>AI mode</label><select id="am"><option value="normal">Normal</option><option value="mentor">Mentor (growth, books, galti sudhaar)</option><option value="biz">Business advisor</option></select>
<label style="margin-top:8px">Movie voice (cloud)</label><div class="row"><select id="cv"><option>Kore</option><option>Aoede</option><option>Leda</option><option>Zephyr</option><option>Callirrhoe</option></select><button id="cl">Cloud: ON</button></div>
<label style="margin-top:8px">Voice mode</label><select id="vm"></select>
<label style="margin-top:8px">Voice (device ki)</label><select id="vv"></select>
<div class="row"><button id="vt">Test voice</button><button id="vs">Voice on/off</button></div>
<label style="margin-top:10px">Naya password</label><div class="row"><input id="np" type="password"><button id="ns">Save</button></div>
<button id="lk" style="width:100%">Lock karo</button></div>
</div>

<script src="core.js"></script>
<script src="cmd.js"></script>
<script src="biz.js"></script>
</body></html>
